# Pushing a version tag (git tag v1.1.0 && git push origin v1.1.0), or "Run workflow" on the Actions tab (releases main as
# v<package.json version>), tests that commit on Windows, builds the portable exe and publishes a GitHub release with the
# notes from docs/releases/<tag>.md plus the exe's SHA-256.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (off = only test and build)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022 # Electron 28's GPU process crashes on the windows-2025 image that windows-latest now uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release tag from package.json
        shell: pwsh
        run: |
          $tag = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and $tag -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} != package.json $tag" }
          if (-not (Test-Path "docs/releases/$tag.md")) { throw "missing docs/releases/$tag.md" }
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code-signing certificate yet
      - name: Release notes with checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*-portable.exe' | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $notes = Get-Content "docs/releases/$env:TAG.md" -Raw
          $notes.Replace('{{SHA256}}', $sha).Replace('{{COMMIT}}', '${{ github.sha }}'.Substring(0, 7)) | Set-Content dist/notes.md -Encoding utf8
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.publish
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cortex ${{ env.TAG }}
          body_path: dist/notes.md
          files: dist/*-portable.exe
